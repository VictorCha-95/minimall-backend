name: CI

on:
  # main 제외 모든 브랜치 push에서 CI
  push:
    branches-ignore: ["main"]

  # main으로 PR 올릴 때도 CI
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: CI (build + test)
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # 필요에 따라 test 대신 build로 바꿔도 됨
      - name: Run tests
        run: ./gradlew test