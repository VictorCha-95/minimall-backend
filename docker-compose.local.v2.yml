services:
  db:
    image: mysql:8.4.4
    ports:
      - "13306:3306"
    env_file:
      - .env
    volumes:
      - db_data_v2:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_v2:
