spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/minimall?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  cache:
    type: redis

  web:
    resources:
      static-locations: classpath:/static/,file:frontend/dist/


server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
