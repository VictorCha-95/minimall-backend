spring:
  application:
    name: MiniMall
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  issuer: minimall
  secret-base64: ${JWT_SECRET_BASE64:PLEASE_OVERRIDE_IN_ENV}
  access-expiration-ms: 3600000        # 1h
  refresh-expiration-ms: 1209600000    # 14d
