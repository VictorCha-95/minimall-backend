spring:
  config:
    activate:
      on-profile: e2e

  datasource:
    url: ${E2E_DB_URL:jdbc:mysql://localhost:3307/minimall_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${E2E_DB_USERNAME:root}
    password: ${E2E_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: false

jwt:
  issuer: minimall-e2e
  secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  access-ttl-seconds: 600
  refresh-ttl-seconds: 86400
