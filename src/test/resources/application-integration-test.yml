spring:
  config:
    activate:
      on-profile: integration-test

  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        hbm2ddl:
          halt_on_error: false

jwt:
  issuer: minimall-it
  secret-base64: ${JWT_SECRET_BASE64:test-secret-base64}
  access-expiration-ms: 600000
  refresh-expiration-ms: 86400000
