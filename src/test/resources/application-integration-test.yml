spring:
  config:
    activate:
      on-profile: integration-test

  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        hbm2ddl:
          halt_on_error: false

jwt:
  issuer: minimall-it
  secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  access-ttl-seconds: 600
  refresh-ttl-seconds: 86400
