spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  issuer: minimall-test
  secret-base64: ${JWT_SECRET_BASE64:test-secret-base64}
  access-expiration-ms: 600000
  refresh-expiration-ms: 86400000